# Example entry (uncomment and copy when adding a feature):
#
#   example-feature:
#     title: "Example Feature"
#     jira: PROJ-123
#     phase: backlog           # backlog|spec|plan|dev|review|ship|done|paused|dropped
#     delivery_phase: null     # int referencing delivery.phases[*].id, or null
#     owner: null              # Person accountable for landing this feature (matches PRD's Owner column)
#     priority: medium
#     started: null
#     spec: n/a
#     plan: n/a
#     blocked_by: []
#     due_date: null           # ISO date — optional feature target date; set via /forge-set-dates (opt-in)
#     follow_up_of: []         # rework lineage — "this is a later pass over these features".
#                              # Distinct from blocked_by (dependency) and from a spec Rev (which covers typos too).
#                              # E.g.: follow_up_of: [feature-a, feature-b]
#     last_updated: "YYYY-MM-DDTHH:MM:SS"
#     notes: ""
#
# Field-name note: features use `owner:` (aligns with setup-level `owner` and the
# /forge-decompose PRD's Owner column). Foundation slices under `setup.foundation`
# use `assignee:` — that's slice-level role tracking, separate from feature ownership.
# The dashboard reads `f.owner ?? f.assignee` so projects that predate this
# convention still render correctly.

# ------------------------------------------------------------------
# Bugs
# ------------------------------------------------------------------
# Post-ship defects. A bug is M:N — one shared-primitive defect can break several
# features at once, so bugs live here as a flat collection (not nested under features).
# The feature↔bug link is single-sourced from `affects` (derived by dashboard).
# A bug does NOT reopen its feature (feature stays done; bug carries its own status).
# `delivery_phase` is the scheduled-fix milestone (defaults to current_phase at discovery).
# Full description (repro / expected / actual / fix) lives in `.forge/bugs.md`, one
# section per bug, joined by id. See `.claude/rules/tracker.md` → "Bug Tracking".
#
# Bug entry shape:
#   - id: BUG-001
#     title: "Short description"
#     status: open             # open | in-progress | fixed | wontfix
#     severity: high           # critical | high | medium | low
#     affects: [feature-a, feature-b]  # feature ids — M:N allowed
#     found_in: null           # feature-id or foundation-slice-id where the bug was introduced
#     delivery_phase: 1        # int — scheduled-fix phase (bump to defer)
#     found_date: "YYYY-MM-DD"
#     spec_ref: null           # path to bugs.md section or a dedicated .forge/bugs/BUG-NNN.md
#     fix_pr: null             # "<repo>#<pr-number>" or null
#     doc: null                # optional path to a dedicated .forge/bugs/BUG-NNN.md for heavy bugs
#     notes: ""

bugs: []
