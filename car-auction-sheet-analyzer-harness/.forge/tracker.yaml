# ------------------------------------------------------------------
# Delivery Phases
# ------------------------------------------------------------------
# Stakeholder-facing delivery milestones. Each phase groups a set of
# features that ship as one coherent, demonstrable slice. Phases are
# layered ON TOP OF the dependency graph — dependencies still drive
# sequencing within a phase; phases drive stakeholder narrative.
#
# Populated by /forge-decompose (Gate 3) after the slicing principle
# and dependency graph are locked. Optional for small projects (under
# ~10 features) — leave `phases: []` and the dashboard hides this view.
#
# Phase statuses:
#   planning      — being shaped (during Gate 3 prep or replanning)
#   in-progress   — currently active (exactly one phase at a time)
#   complete      — sealed; `sealed: <ISO date>` must be set
#   locked        — defined but not opened yet
#
# Invariant: at most one phase carries status `in-progress`, and
# `current_phase` equals that phase's `id` (or null if no phase is
# active). See .claude/rules/tracker.md "Delivery Phase Rules".
#
# Foundation slices (F-001..) are NOT delivery phases — they are
# pre-feature scaffolding and live under `setup.foundation`.

delivery:
  # Engagement-level shipment unit (ship_unit).
  #   wave    — features ship one wave at a time via /forge-deliver +
  #             /forge-wave-decompose. A decomposed feature carries nested
  #             `waves[].workitems[]` + a `decomposition_plan` sibling.
  #   feature — the whole feature ships as a single integration PR; no per-wave
  #             shipping. A decomposed feature carries a FLAT `workitems[]` list.
  # Per-feature override lives at `features[<id>].ship_unit` and is immutable
  # once set at decomposition time.
  ship_unit: wave                # wave | feature — engagement default
  current_phase: 1               # int | null — id of the phase currently in-progress
  phases:
    - id: 1
      title: "Core Analysis"
      theme: "User can upload a USS auction sheet and receive a 3D-enhanced vehicle intelligence report"
      status: in-progress
      started: "2026-05-31"
      sealed: null
      due_date: null             # ISO date — phase target delivery date; set via /forge-set-dates
    - id: 2
      title: "User Operations"
      theme: "Users manage analysis history, purchase credits, dispute failed analyses, and receive email notifications"
      status: locked
      started: null
      sealed: null
      due_date: null             # ISO date — phase target delivery date; set via /forge-set-dates
    - id: 3
      title: "Admin Portal"
      theme: "Internal team can manage disputes, inspect pipeline health, and configure the platform"
      status: locked
      started: null
      sealed: null
      due_date: null             # ISO date — phase target delivery date; set via /forge-set-dates
  # Phase entry shape:
  #   - id: 1
  #     title: "Platform Core"
  #     theme: "Short stakeholder-facing description of what this phase delivers"
  #     status: planning         # planning | in-progress | complete | locked
  #     started: null            # ISO date — set when status flips to `in-progress` (preserved on `complete`)
  #     sealed: null             # ISO date — set when status flips to `complete`

