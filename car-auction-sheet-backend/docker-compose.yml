services:
  postgres:
    image: postgres:15
    container_name: auctioninsight-postgres
    environment:
      POSTGRES_DB: auctioninsight
      POSTGRES_USER: auctioninsight
      POSTGRES_PASSWORD: auctioninsight
    ports:
      - "5432:5432"
    volumes:
      - auctioninsight-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctioninsight -d auctioninsight"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  auctioninsight-pgdata:
